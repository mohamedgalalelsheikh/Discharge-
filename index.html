<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تعليمات الخروج">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>تعليمات الخروج</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
/* Layout: editor column + paper sheet column (stacked with a tab switch on phones) */
:root{
  --bg:#eef2f2; --surface:#ffffff; --fg:#14262b; --muted:#5b6f74; --line:#d3dddd;
  --accent:#0f5e66; --accent-soft:#e0eeee; --warn:#a05a00; --warn-soft:#fff3e2; --danger:#b3261e; --danger-soft:#fdeceb;
  --paper:#ffffff; --ink:#152a2f; --ink-muted:#58696d; --paper-line:#dbe3e3; --paper-accent:#0f5e66;
  --display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1a1c; --surface:#16262a; --fg:#e3ecec; --muted:#93a8ac; --line:#2a3d41;
  --accent:#5fb7bf; --accent-soft:#183a3e; --warn:#f0b062; --warn-soft:#33270f; --danger:#ff8a80; --danger-soft:#3a1a18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a1c; --surface:#16262a; --fg:#e3ecec; --muted:#93a8ac; --line:#2a3d41;
  --accent:#5fb7bf; --accent-soft:#183a3e; --warn:#f0b062; --warn-soft:#33270f; --danger:#ff8a80; --danger-soft:#3a1a18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.app{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header.top h1{font-family:var(--display);font-size:1.35rem;margin:0;color:var(--fg)}
header.top p{margin:0;color:var(--muted);font-size:.9rem}
.tabs{display:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:600 .95rem var(--body);padding:8px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:18px;min-width:0}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
legend{font-family:var(--display);font-size:.95rem;color:var(--accent);padding:0;margin-bottom:6px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.alert{font-size:.85rem;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;margin:0}
.items{display:flex;flex-direction:column;gap:2px}
.items h4{margin:10px 0 4px;font-size:.82rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.items label{flex-direction:row;align-items:flex-start;gap:8px;color:var(--fg);font-size:.9rem;padding:5px 4px;border-radius:6px;cursor:pointer}
.items label:hover{background:var(--accent-soft)}
.items input{width:auto;margin-top:5px;accent-color:var(--accent)}
.items label.off span{color:var(--muted);text-decoration:line-through}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 .95rem var(--body);padding:10px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}
.toast{font-size:.85rem;color:var(--accent);min-height:1.2em;margin:0}

/* Paper sheet: always paper-white so it prints and screenshots the same in both themes */
.sheet-wrap{display:flex;flex-direction:column;gap:12px;min-width:0;position:sticky;top:16px}
.sheet{background:var(--paper);color:var(--ink);border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px rgba(15,60,66,.10);
  padding:26px 26px 20px;font-size:13.5px;line-height:1.75;display:flex;flex-direction:column;gap:14px}
.lh{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:2px solid var(--paper-accent);padding-bottom:10px;flex-wrap:wrap}
.lh-logo{justify-content:space-between;flex-wrap:nowrap}
.lh-logo .ar{min-width:0}
.logo-full{display:block;height:120px;width:auto;max-width:40%;object-fit:contain;flex:none}
@media (max-width:420px){.logo-full{height:96px}.lh .ar b{font-size:1rem}.lh .ar span{font-size:.74rem}}
.logo-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo-row img{height:44px;width:auto;border:1px solid var(--line);border-radius:6px;background:#fff;padding:2px}
.btn[disabled]{opacity:.6;cursor:progress}
.to-sheet{display:none}
@media (max-width:860px){.to-sheet{display:inline-flex}}
.lh .ar b{font-family:var(--display);font-size:1.15rem;color:var(--paper-accent);display:block}
.lh .ar span{color:var(--ink-muted);font-size:.82rem;display:block}
.lh .en{direction:ltr;text-align:left;font-size:.78rem;color:var(--ink-muted);line-height:1.5}
.lh .en b{color:var(--ink);font-size:.86rem}
.doc-title{font-family:var(--display);font-size:1.1rem;margin:0;text-align:center;color:var(--ink)}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 16px;background:#f3f7f7;border-radius:6px;padding:10px 12px;font-size:.88rem}
.meta div{min-width:0}
.meta span{color:var(--ink-muted)}
.sec h3{font-family:var(--display);font-size:.95rem;margin:0 0 4px;color:var(--paper-accent)}
.sec ul{margin:0;padding-inline-start:18px}
.sec li{margin:2px 0}
.dates{display:flex;flex-direction:column;gap:6px}
.date-chip{border:1px solid var(--paper-line);border-radius:6px;padding:8px 10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.date-chip.must{border-color:#d9822b;background:#fff6ea}
.date-chip b{color:var(--ink)}
.sec.warn{background:#fdeeed;border-radius:6px;padding:10px 12px}
.sec.warn h3{color:#a3221b}
.sheet .foot{border-top:1px solid var(--paper-line);padding-top:8px;font-size:.8rem;color:var(--ink-muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.foot .phone{direction:ltr;unicode-bidi:isolate;font-weight:600;color:var(--ink)}
.sample{font-size:.8rem;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:4px 8px;align-self:flex-start;margin:0}

@media (max-width:860px){
  .tabs{display:flex}
  .grid{grid-template-columns:minmax(0,1fr)}
  .sheet-wrap{position:static}
  .app[data-view="edit"] .sheet-wrap{display:none}
  .app[data-view="preview"] .panel{display:none}
  .sheet{padding:18px 16px}
  .meta{grid-template-columns:minmax(0,1fr)}
}
@media print{
  @page{size:A5;margin:9mm}
  body{background:#fff;padding:0}
  header.top,.tabs,.panel,.sheet-actions,.toast,.sample{display:none!important}
  .grid{display:block}.sheet-wrap{display:block!important;position:static}
  .sheet{box-shadow:none;padding:0;font-size:11.5px}
  .sec,.date-chip{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app" dir="rtl" lang="ar" data-view="edit" id="app">
  <header class="top">
    <div>
      <h1>تعليمات الخروج بعد العملية</h1>
      <p>اختر العملية، أكمل البيانات، ثم أرسل الورقة للمريض</p>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-edit" aria-selected="true">البيانات</button>
    <button role="tab" id="tab-preview" aria-selected="false">ورقة المريض</button>
  </div>

  <div class="grid">
    <form class="panel" id="form" autocomplete="off">
      <fieldset>
        <legend>العملية</legend>
        <label>نوع العملية<select id="proc"></select></label>
        <div class="row">
          <label>تاريخ العملية<input type="date" id="surgeryDate"></label>
          <label>المستشفى<select id="hospital"></select></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>المريض</legend>
        <label>الاسم<input id="name" placeholder="اسم المريض"></label>
        <div class="row">
          <label>السن<input id="age" inputmode="numeric" placeholder="مثال: ٦٨"></label>
          <label>رقم واتساب<input id="phone" inputmode="tel" dir="ltr" placeholder="01xxxxxxxxx أو +966…"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>المواعيد</legend>
        <div class="row">
          <label id="catheterWrap">إزالة القسطرة<input type="date" id="catheterDate"></label>
          <label id="stentWrap">إزالة الدعامة (DJ)<input type="date" id="stentDate"></label>
          <label>المتابعة في العيادة<input type="date" id="fuDate"></label>
        </div>
        <label>العيادة<select id="clinic"></select></label>
        <p class="alert" id="stentAlert" hidden>لم يُحدَّد موعد إزالة الدعامة. يُفضّل تحديده قبل خروج المريض.</p>
      </fieldset>

      <fieldset>
        <legend>الأدوية</legend>
        <label>دواء في كل سطر<textarea id="meds" placeholder="مثال: سيفوتاكس ٥٠٠ مجم — قرص كل ١٢ ساعة لمدة ٥ أيام"></textarea></label>
      </fieldset>

      <fieldset>
        <legend>التعليمات</legend>
        <p class="hint">ألغِ تحديد أي تعليمة لا تناسب هذا المريض.</p>
        <div class="items" id="items"></div>
        <label>تعليمات إضافية (سطر لكل تعليمة)<textarea id="notes" placeholder="مثال: إيقاف الأسبرين لحين المتابعة"></textarea></label>
      </fieldset>

      <fieldset>
        <legend>الترويسة</legend>
        <label>تغيير الشعار (اختياري، يُحفظ على هذا الجهاز)<input type="file" id="logoFile" accept="image/*"></label>
        <div class="logo-row" id="logoRow" hidden><img id="logoThumb" alt="الشعار الحالي"><button type="button" class="btn" id="logoRemove">الرجوع للشعار الأصلي</button></div>
      </fieldset>

      <div class="actions">
        <button type="button" class="btn primary to-sheet" id="toSheet">ورقة المريض وPDF ←</button>
        <button type="button" class="btn" id="clear">ورقة جديدة</button>
      </div>
    </form>

    <div class="sheet-wrap">
      <p class="sample" id="sampleTag">بيانات مثال — امسحها بزر «ورقة جديدة»</p>
      <article class="sheet" id="sheet"></article>
      <div class="actions sheet-actions">
        <button type="button" class="btn primary" id="pdfMake" hidden>إنشاء PDF</button>
        <button type="button" class="btn wa" id="pdfShare" hidden>إرسال PDF عبر واتساب</button>
        <button type="button" class="btn" id="pdfSave" hidden>حفظ PDF</button>
      </div>
      <p class="hint" id="pdfHint"></p>
      <div class="actions sheet-actions">
        <a class="btn" id="wa" href="https://wa.me/" target="_blank" rel="noopener">إرسال كنص عبر واتساب</a>
        <button type="button" class="btn" id="copy">نسخ النص</button>
        <button type="button" class="btn" id="print" hidden>طباعة (A5)</button>
      </div>
      <p class="toast" id="toast" aria-live="polite"></p>
    </div>
  </div>
</div>

<script>
(function(){
const HOSPITALS=["مستشفى ويلكير","مستشفى الصفا","المستشفى الفرنساوي","مستشفى الأفق","معهد ناصر"];
const CLINICS=[
  {k:"faisal",n:"عيادة فيصل",a:"٢٠ شارع فيصل"},
  {k:"mohandessin",n:"عيادة المهندسين",a:"٢٦ شارع جامعة الدول العربية، أعلى سوبر ماركت مترو، الدور الثالث"},
  {k:"dokki",n:"عيادة الدقي",a:"٢٢ شارع الحسين، خلف ديفاكتو من شارع محي الدين أبو العز"},
  {k:"safa",n:"عيادة مستشفى الصفا",a:"مستشفى الصفا، شارع مصدق، الدقي"},
  {k:"welcare",n:"عيادة مستشفى ويلكير",a:"مستشفى ويلكير، ٥١ شارع دمشق متفرع من شارع سوريا، المهندسين"}
];
const PHONE="01020857272";

const FLUIDS="اشرب ٢–٣ لترات من السوائل يوميًا، ما لم يحدد لك الطبيب كمية أقل (مثل مرضى القلب أو الكلى).";
const BAG="حافظ على كيس البول أسفل مستوى المثانة دائمًا، ولا تشد القسطرة أو تحاول إخراجها.";
const MEATUS="نظّف مكان خروج القسطرة بالماء والصابون مرتين يوميًا.";
const CONST="تجنب الإمساك والحزق: أكثر من الخضار والفاكهة والسوائل، واستخدم الملين الموصوف.";
const BLOOD="لا توقف ولا تبدأ أي دواء لسيولة الدم إلا بعد الرجوع للطبيب.";
const FEVER="ارتفاع الحرارة إلى ٣٨ درجة أو أكثر، أو رعشة.";
const PAIN="ألم شديد لا يتحسن بالمسكنات الموصوفة.";
const RETEN="عدم القدرة على التبول، أو توقف نزول البول في القسطرة.";
const SCROTAL_ICE="ضع كمادات باردة (ملفوفة في قماش) ١٥ دقيقة عدة مرات يوميًا خلال أول ٤٨ ساعة.";
const SUPPORT="ارتدِ ملابس داخلية ضاغطة (حاملة للصفن) لمدة أسبوعين.";
const SHOWER="يمكنك الاستحمام بعد ٤٨ ساعة، مع تجفيف الجرح جيدًا.";
const WOUND="احمرار أو صديد أو إفرازات من الجرح.";
const PORTS="حافظ على جروح فتحات المنظار نظيفة وجافة، ويمكنك الاستحمام بعد ٤٨ ساعة مع تجفيفها جيدًا.";
const GAS="ألم في الكتف أو انتفاخ بالبطن ليومين أو ثلاثة بسبب الغاز المستخدم في المنظار، ويزول تلقائيًا.";
const WALK="امشِ عدة مرات يوميًا من أول يوم، فالحركة تقلل خطر الجلطات وتساعد على عودة حركة الأمعاء.";
const DVT="تورم أو ألم في سمانة الرجل، أو ضيق مفاجئ في التنفس أو ألم بالصدر.";
const DRAIN="إذا خرجت بأنبوب درنقة: لا تشده، وسجّل كمية السائل يوميًا حتى موعد إزالته.";
const INJ="استمر في حقن السيولة (منع الجلطات) حسب المدة الموصوفة.";
const SOLO="بعد استئصال الكلية: لا تتناول مسكنات من نوع مضادات الالتهاب (مثل الديكلوفيناك والإيبوبروفين) إلا بعد استشارة الطبيب، حفاظًا على الكلية الأخرى.";
const BOWEL="قيء متكرر، أو انتفاخ شديد بالبطن، أو عدم خروج غازات.";

const PROCS={
 holep:{n:"استئصال البروستاتا بالليزر (HoLEP / ThuLEP)",cath:true,stent:false,
  expect:["قد يظهر دم خفيف في البول أو جلطات صغيرة بشكل متقطع لمدة تصل إلى ٤–٦ أسابيع، وهذا متوقع غالبًا.",
   "حرقان وكثرة التبول والإلحاح لعدة أسابيع، ويتحسن تدريجيًا.",
   "قد يحدث تسرب بسيط للبول بعد إزالة القسطرة، ويتحسن عادة خلال أسابيع مع تمارين قاع الحوض.",
   "في أغلب الحالات يتجه السائل المنوي إلى المثانة عند القذف (قذف ارتجاعي)، وهذا غير ضار."],
  care:[FLUIDS,BAG,MEATUS,CONST,
   "تجنب رفع الأوزان الثقيلة (أكثر من ٥ كجم) والمجهود العنيف لمدة ٤ أسابيع.",
   "تجنب ركوب الدراجات والخيل لمدة ٦ أسابيع.",
   "يمكن استئناف العلاقة الزوجية بعد ٤ أسابيع.",
   "ابدأ تمارين قاع الحوض بعد إزالة القسطرة.",BLOOD],
  warn:[RETEN,"نزيف شديد أو جلطات كبيرة تعيق التبول.",FEVER,PAIN]},
 turp:{n:"استئصال البروستاتا بالمنظار (TURP)",cath:true,stent:false,
  expect:["قد يظهر دم في البول بشكل متقطع لمدة تصل إلى ٤ أسابيع، وأحيانًا يزيد بين اليوم ١٠ و١٤.",
   "حرقان وكثرة التبول لعدة أسابيع، ويتحسن تدريجيًا.",
   "في أغلب الحالات يتجه السائل المنوي إلى المثانة عند القذف (قذف ارتجاعي)، وهذا غير ضار."],
  care:[FLUIDS,BAG,MEATUS,CONST,
   "تجنب رفع الأوزان الثقيلة والمجهود العنيف لمدة ٤–٦ أسابيع.",
   "تجنب ركوب الدراجات والخيل لمدة ٦ أسابيع.",
   "يمكن استئناف العلاقة الزوجية بعد ٤ أسابيع.",BLOOD],
  warn:[RETEN,"نزيف شديد أو جلطات كبيرة تعيق التبول.",FEVER,PAIN]},
 urs:{n:"تفتيت حصوة الحالب بالمنظار والليزر مع دعامة (URS)",cath:false,stent:true,stentRequired:true,
  expect:["مع وجود الدعامة: ألم في الجنب أثناء التبول، وكثرة التبول، ودم خفيف في البول. هذه أعراض متوقعة.",
   "قد تنزل فتات صغيرة من الحصوة مع البول خلال الأيام الأولى."],
  care:[FLUIDS,"استخدم الأدوية الموصوفة لتخفيف أعراض الدعامة.",
   "يمكنك العودة للأنشطة اليومية خلال أيام، وتجنب المجهود العنيف طالما الدعامة موجودة.",
   "احتفظ بنتيجة تحليل الحصوة لعرضها في موعد المتابعة.",
   "الدعامة مؤقتة ويجب إزالتها في موعدها. تركها مدة أطول قد يؤدي إلى تكلسها ومضاعفات خطيرة على الكلية."],
  warn:[FEVER+" (يحتاج تقييمًا عاجلًا)",PAIN,"عدم القدرة على التبول.","نزيف شديد أو جلطات."]},
 pcnl:{n:"استخراج حصوة الكلى عن طريق الجلد (PCNL)",cath:false,stent:true,
  expect:["دم في البول خلال الأيام الأولى، ويقل تدريجيًا.",
   "ألم مكان الجرح في الظهر، وقد يحدث تسرب بسيط من الجرح في أول أيام."],

function active(){const p=PROCS[S.proc];const off=S.off[S.proc]||[];const o={};

  const m=lines(S.meds);if(m.length)out.push("","*الأدوية*",b(m));
  const c=a.care.concat(lines(S.notes));if(c.length)out.push("","*تعليمات العناية في المنزل*",b(c));
  if(a.warn.length)out.push("","🚨 *اتصل بنا فورًا أو توجه للطوارئ إذا حدث:*",b(a.warn));
  out.push("",clinic.n+": "+clinic.a,"للتواصل: "+PHONE);
  return out.join("\n");
}
function waNum(){let s=(S.phone||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
  const plus=s.trim().startsWith("+")||s.trim().startsWith("00");s=s.replace(/\D/g,"");
  if(!s)return"";if(s.startsWith("00"))s=s.slice(2);else if(!plus&&s.startsWith("0"))s="20"+s.slice(1);return s}
function waLink(){return "https://wa.me/"+waNum()+"?text="+encodeURIComponent(plain())}

function toast(t){$("toast").textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").textContent="",2500)}

$("form").addEventListener("input",e=>{const id=e.target.id;
  if(F.includes(id)){S[id]=e.target.value;if(id!=="proc")S.sample=false}
  if(e.target.dataset.id){const arr=S.off[S.proc]=S.off[S.proc]||[];const k=e.target.dataset.id;
    const i=arr.indexOf(k);if(e.target.checked){if(i>-1)arr.splice(i,1)}else if(i<0)arr.push(k);
    e.target.closest("label").classList.toggle("off",!e.target.checked)}
  if(id==="proc")renderItems();
  render()});
$("form").addEventListener("submit",e=>e.preventDefault());
$("clear").addEventListener("click",()=>{const keep={proc:S.proc,hospital:S.hospital,clinic:S.clinic,off:S.off};
  S={...keep,surgeryDate:iso(0),name:"",age:"",phone:"",catheterDate:"",stentDate:"",fuDate:"",meds:"",notes:"",sample:false};
  F.forEach(f=>{$(f).value=S[f]||""});render();$("name").focus();toast("بدأت ورقة جديدة")});
$("copy").addEventListener("click",()=>{const t=plain();
  const fb=()=>{const ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();
    toast(ok?"تم نسخ النص":"تعذّر النسخ. استخدم زر واتساب بدلًا منه")};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast("تم نسخ النص"),fb)}else fb()});

/* ---------- Logo ---------- */
$("logoFile").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
    const max=500,k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    LOGO=c.toDataURL("image/png");let saved=true;try{localStorage.setItem(LOGO_KEY,LOGO)}catch(err){saved=false}
    e.target.value="";render();toast(saved?"تم حفظ الشعار":"تمت إضافة الشعار لهذه الجلسة فقط")};
    img.onerror=()=>toast("تعذّر قراءة الصورة. جرّب صورة PNG أو JPG");img.src=r.result};r.readAsDataURL(f)});
$("logoRemove").addEventListener("click",()=>{LOGO=DEFAULT_LOGO;try{localStorage.removeItem(LOGO_KEY)}catch(e){}render();toast("عاد شعار العيادة الأصلي")});

/* ---------- PDF ---------- */
const LIBS={h2c:"https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
  pdf:"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"};
const loaded={};
function load(src){return loaded[src]||(loaded[src]=new Promise((res,rej)=>{const s=document.createElement("script");
  s.src=src;s.onload=res;s.onerror=()=>{delete loaded[src];rej(new Error("load"))};document.head.appendChild(s)}))}

function resetPdf(){pdfFile=null;
  $("pdfMake").hidden=false;
  if(framed){$("pdfHint").textContent="ملف PDF يعمل في النسخة المرفوعة على GitHub Pages (افتحها من Safari).";return}$("pdfShare").hidden=true;$("pdfSave").hidden=true;$("pdfHint").textContent=""}

function fileName(){return "تعليمات-"+(S.name||"المريض").replace(/[\\/:*?"<>|()]/g,"").trim().replace(/\s+/g,"-")+".pdf"}

async function makePdf(){
  if(framed){toast("هذه معاينة فقط. افتح التطبيق من رابط GitHub في Safari لإنشاء PDF");return}
  const btn=$("pdfMake");btn.disabled=true;const label=btn.textContent;btn.textContent="جارٍ الإنشاء…";
  let wrap;
  try{
    await Promise.all([load(LIBS.h2c),load(LIBS.pdf)]);
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    wrap=document.createElement("div");wrap.dir="rtl";wrap.lang="ar";
    wrap.style.cssText="position:fixed;top:0;left:-10000px;width:540px;background:#fff";
    const node=$("sheet").cloneNode(true);node.removeAttribute("id");
    node.style.cssText="box-shadow:none;border-radius:0;padding:24px 24px 18px;width:540px";
    wrap.appendChild(node);document.body.appendChild(wrap);
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const scale=2;
    const canvas=await window.html2canvas(node,{scale,backgroundColor:"#ffffff",useCORS:true,logging:false});
    const top=node.getBoundingClientRect().top;
    const breaks=[...node.querySelectorAll(".lh,.doc-title,.meta,.sec,.sec h3,li,.date-chip,.foot")]
      .map(el=>(el.getBoundingClientRect().bottom-top)*scale).sort((a,b)=>a-b);
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:"mm",format:"a5",orientation:"portrait"});
    const PW=pdf.internal.pageSize.getWidth(),PH=pdf.internal.pageSize.getHeight(),M=8,W=PW-2*M;
    const pxPerMm=canvas.width/W,pageHpx=Math.floor((PH-2*M)*pxPerMm);
    let y=0,first=true;
    while(y<canvas.height-2){
      let end=Math.min(y+pageHpx,canvas.height);
      if(end<canvas.height){const fit=breaks.filter(b=>b>y+60&&b<=end);if(fit.length)end=Math.min(Math.ceil(fit[fit.length-1])+6,end)}
      const h=end-y,pc=document.createElement("canvas");pc.width=canvas.width;pc.height=h;
      const ctx=pc.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,pc.width,h);ctx.drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
      if(!first)pdf.addPage();first=false;
      pdf.addImage(pc.toDataURL("image/jpeg",0.92),"JPEG",M,M,W,h/pxPerMm);
      y=end;
    }
    pdfFile=new File([pdf.output("blob")],fileName(),{type:"application/pdf"});
    btn.hidden=true;$("pdfSave").hidden=false;
    const canShare=!!(navigator.canShare&&navigator.canShare({files:[pdfFile]}));
    $("pdfShare").hidden=!canShare;
    $("pdfHint").textContent=canShare?"الملف جاهز. اضغط «إرسال PDF عبر واتساب» ثم اختر واتساب والمريض.":"الملف جاهز. احفظه ثم أرسله من واتساب كمرفق.";
  }catch(err){
    toast(err&&err.message==="load"?"تعذّر تحميل أداة PDF. تأكد من الاتصال بالإنترنت وحاول مرة أخرى":"تعذّر إنشاء الملف. حاول مرة أخرى");
  }finally{if(wrap)wrap.remove();btn.disabled=false;btn.textContent=label}
}
$("pdfMake").addEventListener("click",makePdf);
$("pdfShare").addEventListener("click",()=>{if(!pdfFile)return;
  navigator.share({files:[pdfFile],title:"تعليمات ما بعد العملية"}).catch(err=>{
    if(!err||err.name!=="AbortError")toast("تعذّرت المشاركة. استخدم «حفظ PDF» بدلًا منها")})});
$("pdfSave").addEventListener("click",()=>{if(!pdfFile)return;const u=URL.createObjectURL(pdfFile);
  const a=document.createElement("a");a.href=u;a.download=pdfFile.name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),60000)});

if(!framed){$("print").hidden=false;$("print").addEventListener("click",()=>window.print())}

function view(v){$("app").dataset.view=v;$("tab-edit").setAttribute("aria-selected",v==="edit");$("tab-preview").setAttribute("aria-selected",v==="preview");window.scrollTo(0,0)}
$("tab-edit").onclick=()=>view("edit");$("toSheet").onclick=()=>view("preview");$("tab-preview").onclick=()=>view("preview");

renderItems();render();
})();
</script>
